
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <form id="registrationForm">
      <h1>Event Registration</h1>
      <p class="subtitle">Register now and reserve your spot!</p>

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name">
      <small id="nameError"></small>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email">
      <small id="emailError"></small>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter phone number">
      <small id="phoneError"></small>

      <label for="event">Select Event</label>
      <select id="event">
        <option value="">Choose an event</option>
        <option value="Web Development Workshop">Web Development Workshop</option>
        <option value="Tech Conference">Tech Conference</option>
        <option value="Coding Competition">Coding Competition</option>
        <option value="AI Seminar">AI Seminar</option>
      </select>
      <small id="eventError"></small>

      <label for="date">Event Date</label>
      <input type="date" id="date">
      <small id="dateError"></small>

      <button type="submit">Register Now</button>

      <p id="successMessage"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
